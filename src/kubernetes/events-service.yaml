apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: cinemaabyss
  labels: { app: events-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: events-service }
  template:
    metadata:
      labels: { app: events-service }
    spec:
      containers:
        - name: events-service
          image: ghcr.io/protasovse/architecture-pro-cinemaabyss/events-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
          envFrom:
            - configMapRef:
                name: cinemaabyss-config
          readinessProbe:
            httpGet:
              path: /api/events/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/events/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 20
          startupProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: cinemaabyss
spec:
  selector: { app: events-service }
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
